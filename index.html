<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- Makes "Add to Home Screen" open full-screen with no browser bar.
     The standard name first; the apple- one stays for older iOS, which
     still only understands that spelling. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learning Pad">
<link rel="apple-touch-icon" href="icon.png">

<!-- Stops the browser's automatic /favicon.ico request (404 on GitHub Pages) -->
<link rel="icon" href="icon.png" type="image/png">
<link rel="shortcut icon" href="icon.png" type="image/png">

<!-- Cross-platform PWA manifest (helps if you ever try this on Android/Fire's Chromium-based browsers) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFB84C">

<title>Language Pad 🇪🇸🇲🇦</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --cream-paper: #FFF8EC;
    --marigold: #FFB84C;
    --coral-pop: #FF6B5B;
    --sky-splash: #4FC3D9;
    --meadow: #7BC96F;
    --ink-plum: #4A3B5C;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream-paper);
    color: var(--ink-plum);
    font-family: 'Nunito', -apple-system, sans-serif;
    overflow: hidden;
    /* prevent iOS bounce/scroll and text selection callouts everywhere */
    position: fixed;
    width: 100%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  header {
    position: relative;
    text-align: center;
    padding: 18px 12px 8px;
    flex-shrink: 0;
  }

  #speedToggle {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    border: none;
    border-radius: 18px;
    padding: 8px 14px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: white;
    background: var(--marigold);
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10);
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  #speedToggle:active { transform: translateY(-50%) scale(0.94); }
  #speedToggle.fast { background: var(--coral-pop); }
  #speedToggle .speed-icon { font-size: 20px; }

  header h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 4vw, 34px);
    margin: 0;
    color: var(--coral-pop);
    letter-spacing: 0.5px;
  }

  main {
    flex: 1;
    overflow: hidden;
    padding: 12px 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    height: 100%;
  }

  /* Word tabs can hold many cards, so let them scroll vertically */
  #wordsGrid, #arabicGrid, #catalanGrid {
    height: 100%;
    align-content: start;
    grid-auto-rows: auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-bottom: 12px;
    /* subtle fade so kids can tell there's more below */
    scrollbar-width: none;
  }
  #wordsGrid::-webkit-scrollbar,
  #arabicGrid::-webkit-scrollbar,
  #catalanGrid::-webkit-scrollbar { display: none; }

  .card {
    border: none;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(16px, 2.4vw, 24px);
    color: white;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 10px 18px rgba(0,0,0,0.10);
    cursor: pointer;
    transition: transform 0.08s ease;
    position: relative;
    -webkit-user-select: none;
  }

  .card:active {
    transform: translateY(6px) scale(0.97);
    box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.10);
  }

  .card .emoji {
    font-size: clamp(38px, 6vw, 60px);
    margin-bottom: 6px;
  }

  .card { padding: 10px 12px; min-height: 142px; }

  /* full-width divider so long lists are skimmable */
  .section-head {
    grid-column: 1 / -1;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(15px, 2.2vw, 21px);
    color: var(--ink-plum);
    opacity: 0.65;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px 0;
  }
  .section-head::after {
    content: "";
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: currentColor;
    opacity: 0.25;
  }

  .card .es-word {
    font-size: clamp(16px, 2.6vw, 26px);
    line-height: 1.1;
    max-width: 100%;
    overflow-wrap: break-word;
  }
  /* English is always visible, in a cream pill so it never rolls
     off the tile and reads clearly on any card color */
  .card .en-word {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: clamp(11px, 1.6vw, 14px);
    color: var(--ink-plum);
    background: var(--cream-paper);
    border-radius: 999px;
    padding: 3px 10px;
    margin-top: 6px;
    max-width: 94%;
    line-height: 1.2;
    overflow-wrap: break-word;
  }

  /* sparkle burst feedback, since she can't rely on reading a confirmation */
  .sparkle {
    position: absolute;
    font-size: 22px;
    pointer-events: none;
    animation: pop-fade 0.6s ease-out forwards;
  }
  @keyframes pop-fade {
    0%   { transform: translate(0,0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
  }

  nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  nav button {
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 2vw, 17px);
    color: white;
    background: #D9CFC1;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  nav button.active.words   { background: var(--meadow); }
  nav button.active.arabic  { background: var(--marigold); }
  nav button.active.catalan { background: var(--coral-pop); }
  nav button .icon { font-size: 19px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="pageTitle">Spanish Words</h1>
    <button id="speedToggle" aria-label="Speaking speed">
      <span class="speed-icon">🐢</span>
      <span class="speed-label">Slow</span>
    </button>
  </header>

  <main>
    <div class="grid" id="wordsGrid"></div>
    <div class="grid hidden" id="arabicGrid"></div>
    <div class="grid hidden" id="catalanGrid"></div>
  </main>

  <nav>
    <button id="tabWords" class="active words"><span class="icon">🇪🇸</span> Spanish</button>
    <button id="tabArabic" class="arabic"><span class="icon">🇲🇦</span> Arabic</button>
    <button id="tabCatalan" class="catalan"><span class="icon">🏰</span> Català</button>
  </nav>
</div>

// Speaking speed toggle: 0.5 = half speed (slow), 1.0 = full speed
let speechRate = 0.5;

// iOS loads voices asynchronously, so grab them up front and refresh
// when they arrive. Picking an explicit voice is far more reliable than
// relying on utter.lang alone.
let VOICES = [];
function refreshVoices() {
  if ("speechSynthesis" in window) VOICES = window.speechSynthesis.getVoices();
}
if ("speechSynthesis" in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
// Many iPads ship without a Catalan voice — a Spanish one reads Catalan
// far more accurately than falling through to the English default.
const VOICE_FALLBACK = { ca: "es" };

function pickVoice(lang) {
  const base = lang.split("-")[0].toLowerCase();
  const bases = [base];
  if (VOICE_FALLBACK[base]) bases.push(VOICE_FALLBACK[base]);
  for (const b of bases) {
    const match = (b === base && VOICES.find(v => v.lang.toLowerCase() === lang.toLowerCase()))
               || VOICES.find(v => v.lang.toLowerCase().startsWith(b));
    if (match) return match;
  }
  return null;
}

// Load voices on first touch. We deliberately do NOT speak a silent
// "priming" utterance here: iOS often never fires `end` on one, which
// leaves the queue stuck `pending` and makes every later tap take the
// cancel path below. The first real card tap unlocks the engine fine.
document.addEventListener("touchend", refreshVoices, { once: true, capture: true });
document.addEventListener("click", refreshVoices, { once: true, capture: true });

let currentUtter = null;  // keep a reference — Safari can GC it mid-speech and go silent
let speakTimer = null;

function speak(text, lang) {
  if (!("speechSynthesis" in window)) return;
  const synth = window.speechSynthesis;

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  const v = pickVoice(lang);
  if (v) utter.voice = v;
  utter.rate = speechRate;
  utter.onend = utter.onerror = () => { currentUtter = null; };
  currentUtter = utter;

  clearTimeout(speakTimer);
  if (synth.speaking || synth.pending) {
    // Interrupting: cancel() and speak() in the SAME tick wedges iOS silent
    // until reload, so let the cancel settle for a beat first. Safe here
    // because the engine is already unlocked (it's mid-sentence).
    synth.cancel();
    speakTimer = setTimeout(() => {
      synth.speak(utter);
      if (synth.paused) synth.resume();
    }, 120);
  } else {
    // Nothing playing: speak straight from the tap so iOS counts the
    // gesture and unlocks the engine on the very first card.
    synth.speak(utter);
    if (synth.paused) synth.resume();
  }
}

function burstSparkles(el) {
  const symbols = ["✨", "⭐", "🌟"];
  for (let i = 0; i < 5; i++) {
    const s = document.createElement("span");
    s.className = "sparkle";
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 30;
    s.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
    s.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
    s.style.left = "50%";
    s.style.top = "50%";
    el.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

// Shared builder for vocab tabs. Each card shows the foreign word with
// its English below; tap once to hear the foreign word, again for English.
// cards: { emoji, word (shown on card), say (text for TTS), lang, en }
function buildVocabGrid(gridId, cards, color) {
  const grid = document.getElementById(gridId);
  cards.forEach(card => {
    // { section: "..." } entries render as a full-width heading, not a card
    if (card.section) {
      const head = document.createElement("div");
      head.className = "section-head";
      head.textContent = card.section;
      grid.appendChild(head);
      return;
    }
    const btn = document.createElement("button");
    btn.className = "card";
    btn.style.background = color;
    btn.dataset.stage = "0";
    btn.innerHTML = `<div class="emoji">${card.emoji}</div><div class="es-word">${card.word}</div><div class="en-word">${card.en}</div>`;
    // "click" (not pointerdown): iOS only allows speech from a completed tap
    btn.addEventListener("click", () => {
      burstSparkles(btn);
      if (btn.dataset.stage === "0") {
        speak(card.say, card.lang);
        btn.dataset.stage = "1";
      } else {
        speak(card.en, "en-US");
        btn.dataset.stage = "0";
      }
    });
    grid.appendChild(btn);
  });
}

const TABS = {
  spanish: { grid: "wordsGrid",  btn: "tabWords",  title: "Spanish Words" },
  arabic:  { grid: "arabicGrid", btn: "tabArabic", title: "Moroccan Words" },
  catalan: { grid: "catalanGrid", btn: "tabCatalan", title: "Catalan Words" },
};

function showTab(tab) {
  Object.entries(TABS).forEach(([name, t]) => {
    document.getElementById(t.grid).classList.toggle("hidden", name !== tab);
    document.getElementById(t.btn).classList.toggle("active", name === tab);
  });
  document.getElementById("pageTitle").textContent = TABS[tab].title;
}

document.getElementById("tabWords").addEventListener("click", () => showTab("spanish"));
document.getElementById("tabArabic").addEventListener("click", () => showTab("arabic"));
document.getElementById("tabCatalan").addEventListener("click", () => showTab("catalan"));

// Speed toggle: flip between slow (50%) and fast (100%) speaking
const speedToggle = document.getElementById("speedToggle");
speedToggle.addEventListener("click", () => {
  const fast = speechRate === 0.5;
  speechRate = fast ? 1.0 : 0.5;
  speedToggle.classList.toggle("fast", fast);
  speedToggle.querySelector(".speed-icon").textContent = fast ? "🐇" : "🐢";
  speedToggle.querySelector(".speed-label").textContent = fast ? "Fast" : "Slow";
});

// Section markers pass straight through; word entries get normalized.
const toCards = (list, wordKey, sayKey, lang) =>
  list.map(w => w.section ? w
    : { emoji: w.emoji, word: w[wordKey], say: w[sayKey], lang, en: w.en });

buildVocabGrid("wordsGrid",
  toCards(VOCAB_WORDS, "es", "es", "es-ES"), "var(--sky-splash)");
buildVocabGrid("arabicGrid",
  toCards(ARABIC_WORDS, "tr", "ar", "ar-SA"), "var(--meadow)");
buildVocabGrid("catalanGrid",
  toCards(CATALAN_WORDS, "ca", "ca", "ca-ES"), "var(--coral-pop)");
showTab("spanish"); // Spanish Words is the default tab

// Register service worker so it keeps working with wifi off
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
